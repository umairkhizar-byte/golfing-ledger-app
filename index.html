<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golf Ledger">
<title>Golf Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2e7d32">
<style>
:root{--bg:#f4f6f1;--card:#fff;--tx:#1b2a1f;--mu:#6b7a6e;--ac:#2e7d32;--in:#2e7d32;--out:#c62828;--bd:#dfe5da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111812;--card:#1b241c;--tx:#e8efe8;--mu:#93a396;--ac:#66bb6a;--in:#66bb6a;--out:#ef6c6c;--bd:#2b372d}}
:root[data-theme="dark"]{--bg:#111812;--card:#1b241c;--tx:#e8efe8;--mu:#93a396;--ac:#66bb6a;--in:#66bb6a;--out:#ef6c6c;--bd:#2b372d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:12px 14px 90px}
h1{font-size:20px;margin:6px 0 10px}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mon b{font-size:17px}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{font-size:12px;color:var(--mu)}
.v{font-size:19px;font-weight:700}
.in{color:var(--in)}.out{color:var(--out)}
.day{display:flex;justify-content:space-between;gap:8px;align-items:center}
.day .d{font-weight:600}
.sm{font-size:12px;color:var(--mu);margin-top:3px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:28px;padding:14px 20px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--tx);width:min(94vw,520px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;margin-top:14px}.row button{flex:1}
.empty{text-align:center;color:var(--mu);padding:24px 0}
.tip{font-size:12px;color:var(--mu);text-align:center;margin-top:14px}
</style>
</head>
<body>
<h1>⛳ Golf Ledger</h1>
<div class="mon"><button id="pv">‹</button><b id="ml"></b><button id="nx">›</button></div>
<div class="card"><div class="grid" id="sum"></div></div>
<div id="list"></div>
<p class="tip">Data is stored on this device.</p>
<button class="p fab" id="add">+ Add day</button>

<dialog id="dlg">
  <b id="dt">Add day</b>
  <label>Date</label><input type="date" id="f_date">
  <label>Kitty won (in)</label><input type="number" inputmode="decimal" id="f_won" placeholder="0">
  <label>My kitty share paid (out)</label><input type="number" inputmode="decimal" id="f_share" placeholder="0">
  <label>Caddy fee (out)</label><input type="number" inputmode="decimal" id="f_caddy" placeholder="0">
  <label>Other expense – green fee, tips, food (out)</label><input type="number" inputmode="decimal" id="f_other" placeholder="0">
  <label>Gross score</label><input type="number" inputmode="numeric" id="f_score" placeholder="e.g. 88">
  <label>Note (optional)</label><input type="text" id="f_note">
  <div class="row"><button id="cancel">Cancel</button><button class="p" id="save">Save</button></div>
  <div class="row" id="delrow" style="display:none"><button id="del" class="out">Delete this day</button></div>
</dialog>

<script>
const KEY="golfLedger.v1";
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let ym=today().slice(0,7), editId=null;
const n=v=>parseFloat(v)||0;
const fmt=x=>Math.abs(Math.round(x*100)/100).toLocaleString("en-IN");
const net=e=>n(e.won)-n(e.share)-n(e.caddy)-n(e.other);
const sgn=x=>(x<0?"−":x>0?"+":"")+fmt(x);

function render(){
  const [y,m]=ym.split("-").map(Number);
  $("ml").textContent=new Date(y,m-1,1).toLocaleString("en-GB",{month:"long",year:"numeric"});
  const rows=data.filter(e=>e.date.startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date));
  const inf=rows.reduce((s,e)=>s+n(e.won),0);
  const kit=rows.reduce((s,e)=>s+n(e.share),0);
  const cad=rows.reduce((s,e)=>s+n(e.caddy),0);
  const oth=rows.reduce((s,e)=>s+n(e.other),0);
  const out=kit+cad+oth, nt=inf-out;
  const sc=rows.filter(e=>e.score!==""&&e.score!=null).map(e=>n(e.score));
  const avg=sc.length?(sc.reduce((a,b)=>a+b,0)/sc.length).toFixed(1):"–";
  const best=sc.length?Math.min(...sc):"–";
  $("sum").innerHTML=
   `<div><div class="k">Inflow (kitty won)</div><div class="v in">${fmt(inf)}</div></div>
    <div><div class="k">Total outflow</div><div class="v out">${fmt(out)}</div></div>
    <div><div class="k">Net for month</div><div class="v ${nt<0?"out":"in"}">${sgn(nt)}</div></div>
    <div><div class="k">Rounds · Avg · Best</div><div class="v">${rows.length} · ${avg} · ${best}</div></div>
    <div><div class="k">Kitty share paid</div><div class="v">${fmt(kit)}</div></div>
    <div><div class="k">Caddy fees${oth?" · Other":""}</div><div class="v">${fmt(cad)}${oth?" · "+fmt(oth):""}</div></div>`;
  $("list").innerHTML=rows.length?rows.map(e=>{
    const t=net(e), dd=new Date(e.date+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
    const parts=[];
    if(n(e.won))parts.push("Won "+fmt(e.won));
    if(n(e.share))parts.push("Share "+fmt(e.share));
    if(n(e.caddy))parts.push("Caddy "+fmt(e.caddy));
    if(n(e.other))parts.push("Other "+fmt(e.other));
    return `<div class="card" data-id="${e.id}"><div class="day"><div><div class="d">${dd}</div><div class="sm">${parts.join(" · ")||"No amounts"}${e.note?"<br>"+esc(e.note):""}</div></div>
    <div style="text-align:right"><div class="v ${t<0?"out":"in"}">${sgn(t)}</div><div class="sm">${e.score!==""&&e.score!=null?"Gross "+e.score:""}</div></div></div></div>`}).join("")
   :`<div class="empty">No entries this month.<br>Tap “+ Add day” to start.</div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shift(d){let [y,m]=ym.split("-").map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}ym=y+"-"+String(m).padStart(2,"0");render()}
$("pv").onclick=()=>shift(-1);$("nx").onclick=()=>shift(1);
function openForm(e){
  editId=e?e.id:null;
  $("dt").textContent=e?"Edit day":"Add day";
  $("f_date").value=e?e.date:(today().startsWith(ym)?today():ym+"-01");
  for(const k of["won","share","caddy","other","score","note"])$("f_"+k).value=e?(e[k]??""):"";
  $("delrow").style.display=e?"flex":"none";
  $("dlg").showModal();
}
$("add").onclick=()=>openForm();
$("cancel").onclick=()=>$("dlg").close();
$("list").onclick=ev=>{const c=ev.target.closest("[data-id]");if(c)openForm(data.find(e=>e.id==c.dataset.id))};
$("save").onclick=()=>{
  const e={id:editId||Date.now(),date:$("f_date").value||today()};
  for(const k of["won","share","caddy","other","score","note"])e[k]=$("f_"+k).value;
  if(editId)data=data.map(x=>x.id==editId?e:x);else data.push(e);
  persist();ym=e.date.slice(0,7);$("dlg").close();render();
};
$("del").onclick=()=>{if(confirm("Delete this day?")){data=data.filter(x=>x.id!=editId);persist();$("dlg").close();render()}};
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
